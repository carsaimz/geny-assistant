# Build nativo — docs/TECHNICAL_SPEC.md §17.2 (workflow 3) e §17.3
name: Build Native / Build Nativo

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "core/**"
      - "native/**"
      - "android/app/src/main/cpp/**"
      - "android/llama-native/**"
      - ".github/workflows/build-native.yml"
  workflow_dispatch:

jobs:
  rust-android:
    name: rust ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Instalar NDK r27
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked
      # TODO core-04: constrói o core COM a feature uniffi — o .so expõe
      # os exports FFI consumidos pelo Kotlin (libgeny_core.so + JNA).
      - name: Build (uniffi)
        working-directory: core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk --target ${{ matrix.target }} --platform 26 -- build --release --features uniffi
      - uses: actions/upload-artifact@v7
        with:
          name: geny-core-${{ matrix.abi }}
          path: core/target/${{ matrix.target }}/release/libgeny_core.so
          if-no-files-found: error

      # Verificação de desvio (só no 1º ABI — determinístico): regenera os
      # bindings Kotlin do .so host (debug, sem strip) e COMPARA com o
      # arquivo versionado. Se mudou a superfície Rust sem regenerar, falha.
      - name: Verificar bindings Kotlin (drift)
        if: matrix.abi == 'arm64-v8a'
        working-directory: core
        run: |
          cargo build --features uniffi
          cargo run --features uniffi --bin uniffi-bindgen generate \
            --library target/debug/libgeny_core.so \
            --language kotlin --out-dir /tmp/gen-check --no-format
          diff -u ../android/app/src/main/gen-kotlin/uniffi/geny_core/geny_core.kt \
            /tmp/gen-check/uniffi/geny_core/geny_core.kt

  # ci-02 (Fase 3): matriz dos wrappers JNI C++ por ABI — whisper.cpp (STT),
  # espeak-ng (fonemização do Piper) e llama.cpp (LLM local) — com artefatos
  # por ABI para inspeção/reuso. Os 3 ABIs espelham o APK universal
  # (armeabi-v7a cobre telemóveis 32-bit).
  cpp-android:
    name: cpp ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # whisper.cpp, llama.cpp e espeak-ng pinados
      - name: Instalar NDK r27 + CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - name: Build whisper JNI (${{ matrix.abi }})
        run: |
          cmake -S android/app/src/main/cpp -B build/whisper/${{ matrix.abi }} \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 \
            -DWHISPER_DIR="$GITHUB_WORKSPACE/native/whisper.cpp" \
            -DESPEAK_DIR="$GITHUB_WORKSPACE/native/espeak-ng" \
            -DLLAMA_DIR="$GITHUB_WORKSPACE/native/llama.cpp"
          cmake --build build/whisper/${{ matrix.abi }} --parallel
      - name: Build llama JNI (${{ matrix.abi }})
        run: |
          cmake -S android/llama-native/src/main/cpp -B build/llama/${{ matrix.abi }} \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 \
            -DLLAMA_DIR="$GITHUB_WORKSPACE/native/llama.cpp"
          cmake --build build/llama/${{ matrix.abi }} --parallel
      - uses: actions/upload-artifact@v7
        with:
          name: geny-jni-${{ matrix.abi }}
          path: |
            build/whisper/${{ matrix.abi }}/libgeny_whisper_jni.so
            build/llama/${{ matrix.abi }}/libgeny_llama_jni.so
          if-no-files-found: error
