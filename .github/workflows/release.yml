# Geny Release — build release APK/AAB (debug signing, no secrets) and publish a GitHub release on v* tags.
name: "Geny Release"

on:
  push:
    tags:
      - "v*"

# Avoid parallel release runs for the same ref.
concurrency:
  group: geny-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      # Check out the repository source.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 17 required by the Android Gradle toolchain (JavaVersion.VERSION_17).
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Latest stable Flutter (satisfies Dart SDK ^3.12.2).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Resolve Dart/Flutter dependencies.
      - name: Install dependencies
        run: flutter pub get

      # Release APK — project currently falls back to debug signing config, so no keystore secrets are needed.
      - name: Build release APK
        run: flutter build apk --release

      # Release App Bundle — same debug signing fallback.
      - name: Build release App Bundle
        run: flutter build appbundle --release

      # Extract the app version from pubspec.yaml and rename the APK to Geny-<version>-release.apk.
      - name: Rename APK with version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk "Geny-${VERSION}-release.apk"

      # Upload the versioned release APK as a workflow artifact.
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: geny-release-apk
          path: Geny-${{ env.VERSION }}-release.apk
          retention-days: 14

      # Upload the release AAB as a workflow artifact.
      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: geny-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Create a GitHub release on the pushed tag, attaching the APK and AAB.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Geny-${{ env.VERSION }}-release.apk
            build/app/outputs/bundle/release/app-release.aab
