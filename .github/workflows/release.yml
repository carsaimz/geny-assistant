# Release — docs/TECHNICAL_SPEC.md §17.2 (workflow 5) e §19
# Publica artefatos assinados em tags v*. Sem segredos de assinatura,
# publica APK de debug como alpha (fallback declarado).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build web
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Sync assets
        run: |
          rm -rf android/app/src/main/assets/public/*
          cp -r app/dist/. android/app/src/main/assets/public/

      # Assinatura real usa segredos (KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS, KEY_PASSWORD) — nunca versionados (docs §17.5).
      - name: Assemble release (ou debug como fallback alpha)
        working-directory: android
        run: gradle :app:assembleRelease :app:assembleDebug

      - name: Renomear artefatos
        run: |
          mkdir -p dist-release
          VERSION="${GITHUB_REF_NAME}"
          for apk in android/app/build/outputs/apk/release/*.apk; do
            [ -e "$apk" ] && cp "$apk" "dist-release/geny-assistant-${VERSION}-release.apk"
          done
          for apk in android/app/build/outputs/apk/debug/*.apk; do
            [ -e "$apk" ] && cp "$apk" "dist-release/geny-assistant-${VERSION}-debug.apk"
          done
          ls -la dist-release/

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
