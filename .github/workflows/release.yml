# Release — docs/TECHNICAL_SPEC.md §17.2 (workflow 5) e §19
# Publica artefatos assinados em tags v*. Sem segredos de assinatura,
# publica APK de debug como alpha (fallback declarado).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build web
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Sync assets
        run: |
          rm -rf android/app/src/main/assets/public/*
          cp -r app/dist/. android/app/src/main/assets/public/

      # Assinatura via segredos do repo (KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS, KEY_PASSWORD — docs §17.5). Sem segredos, o release sai
      # sem assinar (fallback alpha) e o APK debug é o instalável.
      - name: Preparar assinatura (secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/geny-release.jks"
            {
              echo "GENY_KEYSTORE_FILE=$RUNNER_TEMP/geny-release.jks"
              echo "GENY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "GENY_KEY_ALIAS=$KEY_ALIAS"
              echo "GENY_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Assinatura de release configurada."
          else
            echo "Sem secrets de assinatura — APK release sairá sem assinar."
          fi

      - name: Assemble release (ou debug como fallback alpha)
        working-directory: android
        run: gradle :app:assembleRelease :app:assembleDebug

      - name: Verificar assinatura
        if: env.GENY_KEYSTORE_FILE != ''
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | head -5

      - name: Renomear artefatos
        run: |
          mkdir -p dist-release
          VERSION="${GITHUB_REF_NAME}"
          for apk in android/app/build/outputs/apk/release/*.apk; do
            [ -e "$apk" ] && cp "$apk" "dist-release/geny-assistant-${VERSION}-release.apk"
          done
          for apk in android/app/build/outputs/apk/debug/*.apk; do
            [ -e "$apk" ] && cp "$apk" "dist-release/geny-assistant-${VERSION}-debug.apk"
          done
          ls -la dist-release/

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
