# Testes — docs/TECHNICAL_SPEC.md §17.2 (workflow 2) e §18
name: Test / Testes

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  app-web:
    name: app (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  core-rust:
    name: core (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --all-features

  android-unit:
    name: android (testes JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Runtime Capacitor vem de app/node_modules (settings.gradle.kts)
      - name: Instalar dependências web
        run: npm ci
        working-directory: app
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
        working-directory: android
      - name: Upload relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
