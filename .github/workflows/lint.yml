# Lint / Lintagem — docs/TECHNICAL_SPEC.md §17.2 (workflow 1)
name: Lint / Lintagem

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  app-web:
    name: app (ts/eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  core-rust:
    name: core (fmt/clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  android-lint:
    name: android (gradle lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Gradle lint
        run: gradle :app:lintDebug
        working-directory: android

  lua-tools:
    name: tools (luacheck)
    runs-on: ubuntu-latest
    continue-on-error: true # luacheck é advisory na Fase 1
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luarocks
          sudo luarocks install luacheck
      - name: Luacheck
        run: luacheck tools/ --globals geny geny_run --std lua54
