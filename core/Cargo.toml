[package]
name = "geny-core"
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.75"
description = "Geny Assistant — nucleo de orquestracao local-first em Rust (sessao, ferramentas, confirmacao, memoria, i18n)"
license = "Apache-2.0"
repository = "https://github.com/carsaimz/geny-assistant"
keywords = ["assistant", "local-first", "tool-calling", "android"]
categories = ["gui", "internationalization"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# UniFFI (TODO core-04): bindings geny-core ↔ Kotlin via libgeny_core.so.
uniffi = { version = "0.29", optional = true, features = ["build", "cli"] }
# Sandbox Lua (TODO core-07): ferramentas tools/ com API geny.*.
mlua = { version = "0.12", optional = true, features = ["lua54", "vendored", "serialize"] }

[features]
default = []
# Bindings UniFFI para Kotlin (TODO core-04)
uniffi = ["dep:uniffi"]
# VAD — Voice Activity Detection (Fase 2: TODO core-01)
vad = []
# Sandbox Lua para ferramentas da pasta tools/ (Fase 4: TODO core-07)
lua = ["dep:mlua"]
# Memória semântica: índice vetorial + embeddings locais (Fase 5: TODO core-08)
semantic = []
# todas as features usadas pelos testes de integração do CI
all = ["uniffi", "vad", "lua", "semantic"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]

# cdylib: libgeny_core.so para os bindings UniFFI no Android (TODO core-04).
[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
lto = true
codegen-units = 1
strip = true
